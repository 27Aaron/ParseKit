[package]
name = "parse-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Multi-platform social media resolve and media download core"
repository = "https://github.com/27Aaron/Parse"
readme = "README.md"

[dependencies]
chrono = "0.4"
futures-util = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
dotenvy = "0.15"
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
