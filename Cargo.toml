[package]
name = "parse-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Multi-platform social media parse and media download toolkit"
repository = "https://github.com/27Aaron/ParseKit"
readme = "README.md"

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:dotenvy",
    "dep:jpeg-decoder",
    "dep:qrcode",
    "dep:tracing-subscriber",
    "dep:unicode-width",
]

[[bin]]
name = "pk"
path = "src/bin/pk/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = { version = "0.15", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
unicode-width = { version = "0.2", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }
aes = "0.9"
cbc = "0.2"
md-5 = "0.11"

[dev-dependencies]
dotenvy = "0.15"
hex = "0.4"
sha2 = "0.11"

[profile.release]
lto = "thin"
strip = "symbols"
